<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공주의 시간 | 브런치 여행지도</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Malgun Gothic',sans-serif;background:#f7f6f2;color:#26352e}header{padding:23px 4%;background:#263d36;color:white}header h1{margin:5px 0;font-size:28px}header p{margin:0;color:#d3ded7}main{display:grid;grid-template-columns:350px 1fr;min-height:calc(100vh - 120px)}aside{padding:20px;background:white;overflow:auto;max-height:calc(100vh - 120px)}#map{height:calc(100vh - 120px);min-height:520px;background:#e9eee8}.card{border:1px solid #ddd;border-radius:12px;padding:14px;margin:12px 0;cursor:pointer;background:#fff}.card:hover,.card.active{border-color:#316d54;background:#f0f8f2}.card h3{margin:0 0 7px;font-size:17px}.card a{color:#14694b;text-decoration:none;font-size:14px;display:block;margin:8px 0}.small{color:#66746b;font-size:13px}.notice{padding:13px;border-radius:9px;background:#fff4d9;font-size:14px;line-height:1.55;margin-bottom:12px}input{padding:12px;width:100%;border:1px solid #ccc;border-radius:8px}#error{display:none;position:absolute;z-index:10;right:18px;top:145px;max-width:390px;background:#fff;padding:18px;border:1px solid #d9b789;border-radius:12px;box-shadow:0 4px 20px #0002;line-height:1.5}#error strong{display:block;margin-bottom:6px}@media(max-width:800px){main{display:flex;flex-direction:column-reverse}aside{max-height:none}#map{height:58vh;min-height:360px}#error{top:135px;left:12px;right:12px}}</style></head><body><header><small>CHOI HONG DAE · TRAVEL ARCHIVE</small><h1>공주의 시간, 기록의 지도</h1><p>공주의 장소를 선택하면 브런치 글로 이어집니다.</p></header><main><aside><div class="notice">공주 시범판 · 기존에 정리된 브런치 링크 6건을 표시합니다. 일부 장소 배정과 글 제목은 원문 대조가 필요합니다.</div><input id="search" placeholder="장소 또는 글 제목 검색" aria-label="장소 또는 글 제목 검색"><div id="list"></div></aside><div style="position:relative"><div id="map"></div><div id="error" role="alert"><strong>지도를 불러오지 못했습니다.</strong><span id="reason"></span><p class="small">등록한 웹 서비스 URL과 실제 접속 주소가 일치하는지 확인하세요. 아래 글 목록은 계속 사용할 수 있습니다.</p></div></div></main><script>
const places=[{name:'공산성',lat:36.4624,lng:127.1256},{name:'무령왕릉과 왕릉원',lat:36.4600,lng:127.1118},{name:'금강신관공원',lat:36.4715,lng:127.1210},{name:'제민천',lat:36.4559,lng:127.1212},{name:'마곡사',lat:36.5582,lng:127.0191},{name:'국립공주박물관',lat:36.4555,lng:127.1073}];
const articles=[{title:'유네스코 문화유산 공산성',place:'공산성',url:'https://brunch.co.kr/@hitchwill/82'},{title:'추석 나들이',place:'공산성',url:'https://brunch.co.kr/@hitchwill/7029'},{title:'금강의 공주',place:'금강신관공원',url:'https://brunch.co.kr/@hitchwill/6055'},{title:'일상의 회복',place:'제민천',url:'https://brunch.co.kr/@hitchwill/5197'},{title:'무령왕 (武寧王)',place:'무령왕릉과 왕릉원',url:'https://brunch.co.kr/@hitchwill/5084'},{title:'청년 키움 식당',place:'공산성',url:'https://brunch.co.kr/@hitchwill/4339'}];
let map,markers=[],info;function showError(s){document.getElementById('error').style.display='block';document.getElementById('reason').textContent=s}function selectPlace(p){document.querySelectorAll('.card').forEach(c=>c.classList.toggle('active',c.dataset.place===p.name));if(map){map.panTo(new naver.maps.LatLng(p.lat,p.lng));map.setZoom(14);let links=articles.filter(a=>a.place===p.name).map(a=>`<p><a href="${a.url}" target="_blank" rel="noopener">${a.title} ↗</a></p>`).join('')||'<p>연결된 글이 아직 없습니다.</p>';info.setContent(`<div style="padding:12px;min-width:220px;max-width:300px;font-family:sans-serif"><b>${p.name}</b>${links}</div>`);info.open(map,markers[places.indexOf(p)])}}function render(){let q=document.getElementById('search').value.trim().toLowerCase();document.getElementById('list').innerHTML='';places.filter(p=>(p.name+' '+articles.filter(a=>a.place===p.name).map(a=>a.title).join(' ')).toLowerCase().includes(q)).forEach(p=>{let c=document.createElement('div');c.className='card';c.dataset.place=p.name;let h=document.createElement('h3');h.textContent=p.name;c.append(h);let aa=articles.filter(a=>a.place===p.name);if(!aa.length){let t=document.createElement('div');t.className='small';t.textContent='연결된 글 없음';c.append(t)}aa.forEach(a=>{let link=document.createElement('a');link.href=a.url;link.target='_blank';link.rel='noopener';link.textContent=a.title+' ↗';link.onclick=e=>e.stopPropagation();c.append(link)});c.onclick=()=>selectPlace(p);document.getElementById('list').append(c)})}document.getElementById('search').addEventListener('input',render);render();
function initMap(){try{if(!window.naver||!naver.maps)throw Error('지도 스크립트가 로드되지 않았습니다.');map=new naver.maps.Map('map',{center:new naver.maps.LatLng(36.465,127.12),zoom:12,zoomControl:true,zoomControlOptions:{position:naver.maps.Position.TOP_RIGHT}});info=new naver.maps.InfoWindow({backgroundColor:'#fff',borderColor:'#b8c7bc'});places.forEach(p=>{let marker=new naver.maps.Marker({position:new naver.maps.LatLng(p.lat,p.lng),map,title:p.name});markers.push(marker);naver.maps.Event.addListener(marker,'click',()=>selectPlace(p))});}catch(e){showError(e.message)}}
window.addEventListener('load',()=>{setTimeout(()=>{if(!map)showError('지도 인증 또는 네트워크 문제일 수 있습니다. localhost:3000에서 접속했는지 확인하세요.')},7000)});
</script><script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=ux6l2i0k6w" onload="initMap()" onerror="showError('네이버 지도 API 파일을 가져오지 못했습니다.')"></script></body></html>
