<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공주의 시간 | 브런치 여행지도</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Malgun Gothic',sans-serif;background:#f7f6f2;color:#26352e}header{padding:23px 4%;background:#263d36;color:white}header h1{margin:5px 0;font-size:28px}header p{margin:0;color:#d3ded7}main{display:grid;grid-template-columns:350px 1fr;min-height:calc(100vh - 120px)}aside{padding:20px;background:white;overflow:auto;max-height:calc(100vh - 120px)}#map{height:calc(100vh - 120px);min-height:520px;background:#e9eee8}.card{border:1px solid #ddd;border-radius:12px;padding:14px;margin:12px 0;cursor:pointer;background:#fff}.card:hover,.card.active{border-color:#316d54;background:#f0f8f2}.card h3{margin:0 0 7px;font-size:17px}.card a{color:#14694b;text-decoration:none;font-size:14px;display:block;margin:8px 0}.small{color:#66746b;font-size:13px}.notice{padding:13px;border-radius:9px;background:#fff4d9;font-size:14px;line-height:1.55;margin-bottom:12px}input{padding:12px;width:100%;border:1px solid #ccc;border-radius:8px}#error{display:none;position:absolute;z-index:10;right:18px;top:145px;max-width:390px;background:#fff;padding:18px;border:1px solid #d9b789;border-radius:12px;box-shadow:0 4px 20px #0002;line-height:1.5}#error strong{display:block;margin-bottom:6px}@media(max-width:800px){main{display:flex;flex-direction:column-reverse}aside{max-height:none}#map{height:58vh;min-height:360px}#error{top:135px;left:12px;right:12px}}.article-row{display:flex;align-items:center;gap:10px;margin:10px 0;text-decoration:none!important;color:#26352e!important}.article-row img{width:92px;height:66px;object-fit:cover;border-radius:7px;flex:none;background:#e4ebe7}.article-row span{font-size:13px;line-height:1.4}.popup-article{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid #eee;color:#264d3b;text-decoration:none}.popup-article img{width:82px;height:58px;object-fit:cover;border-radius:6px;flex:none}.popup-article span{font-size:13px;line-height:1.4}.map-popup{padding:12px;min-width:230px;max-width:310px;max-height:310px;overflow-y:auto;font-family:system-ui,sans-serif}.map-popup b{font-size:15px}.thumb-note{font-size:11px;color:#777;margin-top:7px}</style></head><body><header><small>CHOI HONG DAE · TRAVEL ARCHIVE</small><h1>공주의 시간, 기록의 지도</h1><p>공주의 장소를 선택하면 브런치 글로 이어집니다.</p></header><main><aside><div class="notice">공주 시범판 · 작은 이미지를 추가했습니다. 실제 촬영 사진을 연결할 수 있도록 준비했습니다. images 폴더에 글 번호로 된 JPG 파일을 올리면 사진이 자동 표시됩니다. 사진이 없으면 임시 일러스트가 나옵니다.</div><input id="search" placeholder="장소 또는 글 제목 검색" aria-label="장소 또는 글 제목 검색"><div id="list"></div></aside><div style="position:relative"><div id="map"></div><div id="error" role="alert"><strong>지도를 불러오지 못했습니다.</strong><span id="reason"></span><p class="small">등록한 웹 서비스 URL과 실제 접속 주소가 일치하는지 확인하세요. 아래 글 목록은 계속 사용할 수 있습니다.</p></div></div></main><script>
const places=[{name:'공산성',lat:36.4624,lng:127.1256},{name:'무령왕릉과 왕릉원',lat:36.4600,lng:127.1118},{name:'금강신관공원',lat:36.4715,lng:127.1210},{name:'제민천',lat:36.4559,lng:127.1212},{name:'마곡사',lat:36.5582,lng:127.0191},{name:'국립공주박물관',lat:36.4555,lng:127.1073}];
const articles=[{title:'유네스코 문화유산 공산성',place:'공산성',url:'https://brunch.co.kr/@hitchwill/82'},{title:'추석 나들이',place:'공산성',url:'https://brunch.co.kr/@hitchwill/7029'},{title:'금강의 공주',place:'금강신관공원',url:'https://brunch.co.kr/@hitchwill/6055'},{title:'일상의 회복',place:'제민천',url:'https://brunch.co.kr/@hitchwill/5197'},{title:'무령왕 (武寧王)',place:'무령왕릉과 왕릉원',url:'https://brunch.co.kr/@hitchwill/5084'},{title:'제민천의 소녀들',place:'제민천',url:'https://brunch.co.kr/@hitchwill/8960'},{title:'여름예고편, 공주한옥마을',place:'국립공주박물관',url:'https://brunch.co.kr/@hitchwill/9176'}];
// 사진 파일을 images/82.jpg 같은 이름으로 올리면 실제 사진으로 교체됩니다. 이미지가 없으면 일러스트를 표시합니다.
const palettes=[['#bfd4c2','#567c68'],['#d8c5a9','#876f59'],['#bed4e3','#577e98'],['#d7d6b3','#7e9565'],['#b6cfb9','#476f59'],['#d7c2b6','#866f63']];
function thumb(place){const i=Math.max(0,places.findIndex(p=>p.name===place));const [sky,land]=palettes[i];const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="240" height="160" viewBox="0 0 240 160"><rect width="240" height="160" fill="${sky}"/><circle cx="188" cy="39" r="20" fill="#fff5d9" opacity=".85"/><path d="M0 120 Q55 45 116 110 Q177 55 240 120 V160 H0" fill="${land}" opacity=".5"/><path d="M0 145 Q55 95 110 133 Q180 90 240 140 V160 H0" fill="${land}"/><path d="M67 116V80L120 55L173 80V116" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round" opacity=".8"/><path d="M81 118V90H159V118" fill="#fff" opacity=".55"/></svg>`;return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
function articleHtml(a,popup=false){const id=a.url.split("/").pop();const cls=popup?'popup-article':'article-row';return `<a class="${cls}" href="${a.url}" target="_blank" rel="noopener noreferrer"><img src="images/${id}.jpg" onerror="this.onerror=null;this.src='${thumb(a.place)}'" alt="${a.title} 대표 사진"><span>${a.title} ↗</span></a>`}
let map,markers=[],info;function showError(s){document.getElementById('error').style.display='block';document.getElementById('reason').textContent=s}function selectPlace(p){document.querySelectorAll('.card').forEach(c=>c.classList.toggle('active',c.dataset.place===p.name));if(map){map.panTo(new naver.maps.LatLng(p.lat,p.lng));map.setZoom(14);let links=articles.filter(a=>a.place===p.name).map(a=>articleHtml(a,true)).join('')||'<p>연결된 글이 아직 없습니다.</p>';info.setContent(`<div class="map-popup"><b>${p.name}</b>${links}<div class="thumb-note">사진을 등록하지 않은 글에는 임시 이미지가 표시됩니다.</div></div>`);info.open(map,markers[places.indexOf(p)])}}function render(){let q=document.getElementById('search').value.trim().toLowerCase();document.getElementById('list').innerHTML='';places.filter(p=>(p.name+' '+articles.filter(a=>a.place===p.name).map(a=>a.title).join(' ')).toLowerCase().includes(q)).forEach(p=>{let c=document.createElement('div');c.className='card';c.dataset.place=p.name;let h=document.createElement('h3');h.textContent=p.name;c.append(h);let aa=articles.filter(a=>a.place===p.name);if(!aa.length){let t=document.createElement('div');t.className='small';t.textContent='연결된 글 없음';c.append(t)}aa.forEach(a=>{let wrap=document.createElement('div');wrap.innerHTML=articleHtml(a);let link=wrap.firstElementChild;link.onclick=e=>e.stopPropagation();c.append(link)});c.onclick=()=>selectPlace(p);document.getElementById('list').append(c)})}document.getElementById('search').addEventListener('input',render);render();
function initMap(){try{if(!window.naver||!naver.maps)throw Error('지도 스크립트가 로드되지 않았습니다.');map=new naver.maps.Map('map',{center:new naver.maps.LatLng(36.465,127.12),zoom:12,zoomControl:true,zoomControlOptions:{position:naver.maps.Position.TOP_RIGHT}});info=new naver.maps.InfoWindow({backgroundColor:'#fff',borderColor:'#b8c7bc'});places.forEach(p=>{let marker=new naver.maps.Marker({position:new naver.maps.LatLng(p.lat,p.lng),map,title:p.name});markers.push(marker);naver.maps.Event.addListener(marker,'click',()=>selectPlace(p))});}catch(e){showError(e.message)}}
window.addEventListener('load',()=>{setTimeout(()=>{if(!map)showError('지도 인증 또는 네트워크 문제일 수 있습니다. localhost:3000에서 접속했는지 확인하세요.')},7000)});
</script><script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=ux6l2i0k6w" onload="initMap()" onerror="showError('네이버 지도 API 파일을 가져오지 못했습니다.')"></script></body></html>
